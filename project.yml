# XcodeGen proje tanımı.
# .xcodeproj bu dosyadan üretilir ve git'e commit EDİLMEZ.
#   xcodegen generate
#
# Yeni bir kaynak dosya eklerken: dosyayı doğru klasöre koy, hepsi bu.
# sources yol bazlı çalışır, dosyaları tek tek listelemek gerekmez.

name: KodKirintisi

options:
  bundleIdPrefix: com.beratsumer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  findCarthageFrameworks: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    CODE_SIGN_STYLE: Automatic
    # Xcode'un Signing sekmesinden değil buradan: .xcodeproj üretilen bir
    # dosya, orada seçilen team ilk `xcodegen generate`'te silinir.
    DEVELOPMENT_TEAM: "AJMFR76NFH"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO # CI'da YES'e çekilebilir
    TARGETED_DEVICE_FAMILY: "1" # sadece iPhone

packages:
  KodKirintisiCore:
    path: Core

targets:
  # ─────────────────────────────────────────────────────────
  KodKirintisi:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - package: KodKirintisiCore
        product: KodKirintisiCore
      - target: KodKirintisiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beratsumer.kodkirintisi
        PRODUCT_NAME: Kod Kırıntısı
        # The display name has a space and Turkish letters, which would make the
        # Swift module `Kod_Kırıntısı` and the test target's import unwieldy.
        PRODUCT_MODULE_NAME: KodKirintisi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Shared/DesignSystem draws with `.tint`, and both targets compile
        # Shared, so both must resolve the same accent colour.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kod Kırıntısı
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait alone is not a complete answer without this: the build
        # otherwise warns that every orientation must be supported. The app is
        # iPhone-only (TARGETED_DEVICE_FAMILY 1) and every screen is a single
        # column, so there is nothing landscape would add.
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Automatic
        CFBundleLocalizations:
          - en
          - tr
        NSSupportsLiveActivities: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/KodKirintisi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.beratsumer.kodkirintisi

  # ─────────────────────────────────────────────────────────
  KodKirintisiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Shared
    dependencies:
      - package: KodKirintisiCore
        product: KodKirintisiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beratsumer.kodkirintisi.widget
        PRODUCT_NAME: KodKirintisiWidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kod Kırıntısı
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The widget resolves its strings against its OWN bundle, not the
        # app's, so it has to declare the same languages. Shared/ — including
        # Localizable.xcstrings — is compiled into both targets for the same
        # reason. Leave this out and the widget silently falls back to
        # English while the app is Turkish.
        CFBundleLocalizations:
          - en
          - tr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/KodKirintisiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.beratsumer.kodkirintisi

  # ─────────────────────────────────────────────────────────
  KodKirintisiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: KodKirintisi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beratsumer.kodkirintisi.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the target name, but the product is
        # named "Kod Kırıntısı", so the default path misses the bundle.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kod Kırıntısı.app/Kod Kırıntısı
        BUNDLE_LOADER: $(TEST_HOST)

  # ─────────────────────────────────────────────────────────
  # Drives the app to capture App Store screenshots. Deliberately kept out
  # of the KodKirintisi scheme's test action: it needs a booted simulator
  # and takes minutes, while that scheme is what CI and everyday runs use.
  KodKirintisiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: KodKirintisi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beratsumer.kodkirintisi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KodKirintisi

schemes:
  KodKirintisi:
    build:
      targets:
        KodKirintisi: all
        KodKirintisiWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KodKirintisiTests
    archive:
      config: Release

  # Screenshot capture, run on demand by scripts/make-screenshots.sh.
  Screenshots:
    build:
      targets:
        KodKirintisi: all
        KodKirintisiWidget: all
    test:
      config: Debug
      targets:
        - KodKirintisiUITests
